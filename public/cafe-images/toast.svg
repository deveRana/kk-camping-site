<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad-toast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B15;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#grad-toast)"/>

  <!-- Pattern overlay -->
  <circle cx="100" cy="100" r="80" fill="#F59E0B" opacity="0.05"/>
  <circle cx="700" cy="500" r="120" fill="#F59E0B" opacity="0.05"/>
  <circle cx="650" cy="150" r="60" fill="#F59E0B" opacity="0.05"/>

  <!-- Center content -->
  <g transform="translate(400, 300)">
    <!-- Emoji (using text) -->
    <text
      x="0"
      y="0"
      font-size="120"
      text-anchor="middle"
      alignment-baseline="middle"
      opacity="0.9"
    >🍞</text>

    <!-- Label -->
    <text
      x="0"
      y="100"
      font-size="32"
      font-weight="600"
      text-anchor="middle"
      fill="#78350F"
      font-family="system-ui, -apple-system, sans-serif"
    >French Toast</text>

    <!-- Decorative line -->
    <line
      x1="-60"
      y1="130"
      x2="60"
      y2="130"
      stroke="#F59E0B"
      stroke-width="3"
      opacity="0.5"
    />
  </g>

  <!-- Corner accent -->
  <circle cx="40" cy="560" r="20" fill="#F59E0B" opacity="0.3"/>
  <circle cx="760" cy="40" r="25" fill="#F59E0B" opacity="0.3"/>
</svg>